<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TrialMatch in 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed 3D scene, one walkthrough panel bottom-left, title top-left */
:root{
  --bg:#DDE3E6;--panel:rgba(255,255,255,0.94);--ink:#15212B;--muted:#56656F;--line:#D5DDE1;
  --accent:#2D5B8C;--accent-bg:#E4ECF5;--code:#F1F4F6;--good:#2E6B4A;--warn:#8A5A00;--bad:#B3261E;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1217;--panel:rgba(22,31,38,0.94);--ink:#E4EAEE;--muted:#98A7B1;--line:#29353E;
    --accent:#86B2E0;--accent-bg:#18293A;--code:#0F161B;--good:#7FC8A0;--warn:#E3B567;--bad:#F2A49E;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1217;--panel:rgba(22,31,38,0.94);--ink:#E4EAEE;--muted:#98A7B1;--line:#29353E;
  --accent:#86B2E0;--accent-bg:#18293A;--code:#0F161B;--good:#7FC8A0;--warn:#E3B567;--bad:#F2A49E;color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;overflow:hidden}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);left:16px;right:16px;pointer-events:none}
.hud h1{margin:0;font-size:20px;font-weight:600;letter-spacing:-0.01em}
.hud p{margin:2px 0 0;color:var(--muted);font-size:14px}

.panel{position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:min(460px,calc(100% - 32px));
  max-height:min(62vh,660px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:16px 18px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.chip{background:var(--accent-bg);color:var(--accent);border-radius:999px;padding:1px 10px;font-weight:500}
.tier{font-size:12px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase}
.tier.local{color:var(--good)}.tier.cloud{color:var(--warn)}
.panel h2{margin:6px 0 6px;font-size:19px;font-weight:600;letter-spacing:-0.01em;line-height:1.3;text-wrap:balance}
.panel p.body{margin:0 0 10px;font-size:15px}
pre{margin:0 0 10px;background:var(--code);border:1px solid var(--line);border-radius:8px;padding:10px 12px;
  font-family:var(--mono);font-size:12.5px;line-height:1.55;overflow-x:auto;white-space:pre}
table.res{width:100%;border-collapse:collapse;font-size:13.5px;margin:0 0 10px;font-variant-numeric:tabular-nums}
table.res th,table.res td{text-align:left;padding:3px 6px;border-bottom:1px solid var(--line)}
table.res td.n{text-align:right;font-family:var(--mono)}
table.res tr.top td{font-weight:600}
ol.steps{margin:0 0 10px;padding-left:22px;font-size:14px}
ol.steps li{padding:3px 0;color:var(--muted)}
ol.steps li.on{color:var(--ink);font-weight:500}
ol.steps li.on::marker{color:var(--accent)}
.controls{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.controls button.b{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:14px}
.controls button.primary{background:var(--accent);color:var(--panel);border-color:var(--accent);font-weight:500}
.controls button:disabled{opacity:0.4;cursor:default}
.dots{display:flex;gap:6px;margin-left:auto}
.dots button{width:12px;height:12px;border-radius:50%;border:1px solid var(--muted);background:none;padding:0}
.dots button[aria-current="true"]{background:var(--accent);border-color:var(--accent)}
.fail{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--muted)}
@media (max-width:640px){
  .hud h1{font-size:17px}.hud p{display:none}
  .panel{max-height:48vh;padding:14px}
  .panel h2{font-size:17px}
}
</style>
</head>
<body>
<canvas id="scene" aria-label="3D scene of a patient note moving through the TrialMatch agents"></canvas>
<div class="hud"><h1>TrialMatch, end to end</h1><p>One patient note, 12 candidate trials, every step on the local machine except parsing public trial text</p></div>
<section class="panel" aria-live="polite">
  <div class="meta"><span id="count"></span><span class="chip" id="where"></span><span class="tier" id="tier"></span></div>
  <h2 id="ttl"></h2>
  <p class="body" id="body"></p>
  <div id="extra"></div>
  <div class="controls">
    <button class="b" id="prev" aria-label="Previous stage">Back</button>
    <button class="b primary" id="play">Pause</button>
    <button class="b" id="next" aria-label="Next stage">Next</button>
    <div class="dots" id="dots" role="group" aria-label="Jump to stage"></div>
  </div>
</section>
<div class="fail" id="fail">The 3D view couldn't load in this browser. Try a recent version of Chrome, Edge, Safari or Firefox.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
if(typeof THREE==="undefined"){document.getElementById("fail").style.display="flex";return;}

const SANS="'IBM Plex Sans', system-ui, sans-serif", MONO="'IBM Plex Mono', ui-monospace, monospace";
const isDark=()=>{const t=document.documentElement.dataset.theme;if(t==="dark")return true;if(t==="light")return false;return matchMedia("(prefers-color-scheme: dark)").matches;};

/* ---------- renderer ---------- */
const canvas=document.getElementById("scene");
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:true});}catch(e){document.getElementById("fail").style.display="flex";return;}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42,1,0.1,220);
scene.add(new THREE.HemisphereLight(0xffffff,0x6b7880,0.62));
const sun=new THREE.DirectionalLight(0xffffff,1.05);sun.position.set(24,26,18);sun.target.position.set(17,0,-2);scene.add(sun,sun.target);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-28,right:28,top:18,bottom:-18,near:1,far:90});sun.shadow.bias=-0.0006;
const rim=new THREE.DirectionalLight(0xd2e3ff,0.45);rim.position.set(6,10,-18);scene.add(rim);

const M=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:0.7,metalness:0.05},o||{}));
const P=(x,y,z)=>new THREE.Vector3(x,y,z);
const ease=t=>t<=0?0:t>=1?1:t*t*(3-2*t);
const seg=(t,a,b)=>ease((t-a)/(b-a));
const lerp=(a,b,k)=>a+(b-a)*k;
function rr(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}
function makeCanvas(w,h){const c=document.createElement("canvas");c.width=w;c.height=h;const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=renderer.capabilities.getMaxAnisotropy();
  return {c,t,w,h,ctx:c.getContext("2d"),draw(fn){this.ctx.clearRect(0,0,w,h);fn(this.ctx,w,h);this.t.needsUpdate=true;}};}
function wrap(x,text,X,Y,maxW,lh){const words=text.split(" ");let line="";for(const w of words){const test=line?line+" "+w:w;if(x.measureText(test).width>maxW&&line){x.fillText(line,X,Y);Y+=lh;line=w;}else line=test;}if(line)x.fillText(line,X,Y);return Y;}
function moveArc(o,a,b,k,h){o.position.lerpVectors(a,b,k);o.position.y+=Math.sin(k*Math.PI)*(h||0);}
function place(o,v){o.position.copy(v);}
const redraws=[];

/* ---------- world ---------- */
const floorMat=M(0xC6CFD3,{roughness:1});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(110,60),floorMat);floor.rotation.x=-Math.PI/2;floor.position.set(17,0,-4);scene.add(floor);
function zone(x,z,w,d,color,op){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),new THREE.MeshBasicMaterial({color,transparent:true,opacity:op||0.34}));m.rotation.x=-Math.PI/2;m.position.set(x,0.006,z);scene.add(m);return m;}
const railMat=new THREE.MeshBasicMaterial({color:0x2D5B8C,transparent:true,opacity:0.55});
const rail=new THREE.Mesh(new THREE.PlaneGeometry(37,0.2),railMat);rail.rotation.x=-Math.PI/2;rail.position.set(17,0.012,2.3);scene.add(rail);

function label(text,sub,width){
  const h=sub?150:96;const cv=makeCanvas(600,h);
  const fn=(x,w,H)=>{x.fillStyle="rgba(255,255,255,0.95)";rr(x,4,4,w-8,H-8,20);x.fill();x.strokeStyle="rgba(21,33,43,0.18)";x.lineWidth=2;x.stroke();
    x.textAlign="center";x.textBaseline="middle";x.fillStyle="#15212B";x.font=`600 40px ${SANS}`;x.fillText(text,w/2,sub?54:H/2);
    if(sub){x.fillStyle="#56656F";x.font=`400 29px ${SANS}`;x.fillText(sub,w/2,106);}};
  cv.draw(fn);redraws.push(()=>cv.draw(fn));
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:cv.t,transparent:true,depthWrite:false}));
  const W=width||2.6;s.scale.set(W,W*h/600,1);return s;
}
function addLabel(text,sub,width,x,y,z){const l=label(text,sub,width);l.position.set(x,y,z);scene.add(l);return l;}

function person(o){
  const g=new THREE.Group();
  const skin=M(o.skin,{roughness:0.5}),top=M(o.top,{roughness:0.6}),bottom=M(o.bottom,{roughness:0.75}),
        shoe=M(0x15191C,{roughness:0.4}),hairM=M(o.hair,{roughness:0.85}),eyeM=M(0x1A1410,{roughness:0.3});
  const legGeo=new THREE.CylinderGeometry(0.075,0.062,0.78,16);legGeo.translate(0,-0.39,0);
  const legL=new THREE.Mesh(legGeo,bottom);legL.position.set(-0.1,0.82,0);
  const legR=new THREE.Mesh(legGeo,bottom);legR.position.set(0.1,0.82,0);
  [legL,legR].forEach(l=>{const sh=new THREE.Mesh(new THREE.BoxGeometry(0.13,0.07,0.25),shoe);sh.position.set(0,-0.76,0.05);l.add(sh);});
  g.add(legL,legR);
  const hips=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.2,0.24,20),bottom);hips.position.y=0.9;g.add(hips);
  const torso=new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.2,0.6,24),top);torso.position.y=1.25;g.add(torso);
  const lan=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.11,0.02),M(0x2D5B8C));lan.position.set(-0.12,1.33,0.24);g.add(lan);
  const neck=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.07,0.1,14),skin);neck.position.y=1.6;g.add(neck);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.15,28,20),skin);head.position.y=1.78;head.scale.set(0.95,1.08,1);g.add(head);
  const hair=new THREE.Mesh(new THREE.SphereGeometry(0.162,28,20,0,Math.PI*2,0,Math.PI*0.56),hairM);hair.position.set(0,1.8,-0.012);hair.rotation.x=-0.35;hair.scale.set(0.97,1.08,1.02);g.add(hair);
  [-0.05,0.05].forEach(x=>{const e=new THREE.Mesh(new THREE.SphereGeometry(0.017,10,8),eyeM);e.position.set(x,1.8,0.14);g.add(e);});
  const armGeo=new THREE.CylinderGeometry(0.056,0.046,0.58,14);armGeo.translate(0,-0.29,0);
  const mkArm=x=>{const a=new THREE.Mesh(armGeo,top);a.position.set(x,1.5,0);a.rotation.z=x<0?-0.07:0.07;
    const hand=new THREE.Mesh(new THREE.SphereGeometry(0.055,14,10),skin);hand.position.y=-0.61;a.add(hand);
    const sh=new THREE.Mesh(new THREE.SphereGeometry(0.075,16,12),top);a.add(sh);return a;};
  const armL=mkArm(-0.3),armR=mkArm(0.3);g.add(armL,armR);
  g.userData={legL,legR,armL,armR};return g;
}
function walk(p,t,moving){const a=moving?Math.sin(t*9)*0.45:0;p.userData.legL.rotation.x=a;p.userData.legR.rotation.x=-a;p.userData.armL.rotation.x=-a*0.6;}

/* station floor patches */
zone(0,0,5,6,0x2D5B8C);zone(6,0,4,6,0x3E7CB1);zone(12,0,5.6,6,0x4A6FA5);
zone(23.2,0,11.6,6,0x2E8C6A);zone(31.5,0,3.6,6,0x5B7F3A);zone(35.3,0,3.4,6,0x2D5B8C);
zone(13,-10,13,5,0xB07A1E,0.26);

/* ---------- local machine boundary ---------- */
const LB={x0:-3.2,x1:37.4,z0:-4,z1:3.6,h:4.4};
const lbGeo=new THREE.BoxGeometry(LB.x1-LB.x0,LB.h,LB.z1-LB.z0);
const lbCenter=P((LB.x0+LB.x1)/2,LB.h/2,(LB.z0+LB.z1)/2);
const lbFill=new THREE.Mesh(lbGeo,new THREE.MeshBasicMaterial({color:0x2E8C6A,transparent:true,opacity:0.06,depthWrite:false}));lbFill.position.copy(lbCenter);scene.add(lbFill);
const lbEdgeMat=new THREE.LineBasicMaterial({color:0x2E9C72,transparent:true,opacity:0.9});
const lbEdges=new THREE.LineSegments(new THREE.EdgesGeometry(lbGeo),lbEdgeMat);lbEdges.position.copy(lbCenter);scene.add(lbEdges);
addLabel("Local machine","Patient text never leaves this box",3.6,LB.x0+3.4,LB.h+0.55,LB.z0+0.4);
/* one-way port in the back wall for parsed criteria */
const PORT=P(13,1.4,LB.z0);
const port=new THREE.Mesh(new THREE.TorusGeometry(0.5,0.07,12,40),M(0xD9A23A,{emissive:0xD9A23A,emissiveIntensity:0.5}));port.position.copy(PORT);scene.add(port);
addLabel("Public text only",null,1.9,PORT.x,PORT.y+0.95,PORT.z);

/* ---------- clinic desk (stage 0 + review at end) ---------- */
function desk(x,z){const d=new THREE.Mesh(new THREE.BoxGeometry(2.4,0.9,0.85),M(0xF1F4F5,{roughness:0.5}));d.position.set(x,0.45,z);scene.add(d);return d;}
desk(0,0);
const noteCv=makeCanvas(560,740);
const NOTE_LINES=["74M hx of CAD s/p CABG, EF 60%","prior CVA (no residual deficits),","HTN, HL, DMII, Moderate to","Severe PVD ... carotid bruits.","","Angiography revealed an 80%","stenosis of the R ICA and a 90%","L ICA stenosis.","","Past Medical History:","CAD s/p CABG  ·  Prior CVA","Bilateral carotid artery disease"];
function drawNote(){noteCv.draw((x,w,h)=>{x.fillStyle="#FFFFFF";x.fillRect(0,0,w,h);
  x.fillStyle="#15212B";x.font=`600 32px ${SANS}`;x.fillText("Patient note",34,62);
  x.fillStyle="#56656F";x.font=`400 21px ${SANS}`;x.fillText("TREC 2021 topic 5 · de-identified",34,96);
  x.strokeStyle="#C9D1D5";x.lineWidth=2;x.beginPath();x.moveTo(34,118);x.lineTo(w-34,118);x.stroke();
  x.fillStyle="#26323A";x.font=`400 23px Georgia, serif`;NOTE_LINES.forEach((l,i)=>x.fillText(l,34,166+i*44));});}
const note=new THREE.Mesh(new THREE.PlaneGeometry(0.46,0.6),new THREE.MeshBasicMaterial({map:noteCv.t,transparent:true,side:THREE.DoubleSide}));scene.add(note);
const NOTE_DESK=P(0.25,0.91,0.12);
const laptopBase=new THREE.Mesh(new THREE.BoxGeometry(0.75,0.03,0.5),M(0x2A343B,{metalness:0.3,roughness:0.4}));laptopBase.position.set(-0.55,0.915,0.05);scene.add(laptopBase);
const laptopLid=new THREE.Mesh(new THREE.BoxGeometry(0.75,0.48,0.02),M(0x2A343B,{metalness:0.3,roughness:0.4}));laptopLid.position.set(-0.55,1.15,-0.2);laptopLid.rotation.x=-0.18;scene.add(laptopLid);
const coord=person({skin:0x9C6B4A,top:0x3A5F7D,bottom:0x2B2F38,hair:0x1C1714});coord.position.set(-0.5,0,-0.95);scene.add(coord);
const cTag=label("Research coordinator",null,2.0);cTag.position.set(0,2.2,0);coord.add(cTag);
addLabel("Clinic","A note to screen",2.2,0,2.95,-1.6);

/* ---------- cloud: registry + parser (outside the box) ---------- */
const REG=P(8,0,-10),API=P(17.5,0,-10);
const regB=M(0xE7E2D6,{roughness:0.8});
const reg=new THREE.Group();
[[0,1.2,2.4,2.4,1.4],[0,2.75,2.0,0.7,1.2]].forEach(([y,yy,w,h,d])=>{const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),regB);b.position.set(0,yy,0);reg.add(b);});
for(let i=0;i<4;i++){const c=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,2.4,12),M(0xF4F1EA));c.position.set(-0.9+i*0.6,1.2,0.75);reg.add(c);}
reg.position.copy(REG);scene.add(reg);
addLabel("ClinicalTrials.gov","Public registry text",2.9,REG.x,4.1,REG.z);
const apiMat=M(0xD9A23A,{emissive:0xD9A23A,emissiveIntensity:0.15,roughness:0.5});
const apiG=new THREE.Group();
[[0,0,0,0.85],[0.75,-0.15,0.1,0.6],[-0.75,-0.18,0,0.62],[0.3,0.38,-0.2,0.55]].forEach(([x,y,z,r])=>{const s=new THREE.Mesh(new THREE.SphereGeometry(r,28,20),apiMat);s.position.set(x,y,z);apiG.add(s);});
apiG.position.set(API.x,2.2,API.z);scene.add(apiG);
addLabel("Cloud API","Splits criteria into atomic checks",3.3,API.x,3.9,API.z);
const trialDocCv=makeCanvas(512,660);
trialDocCv.draw((x,w,h)=>{x.fillStyle="#FBFAF6";x.fillRect(0,0,w,h);x.fillStyle="#15212B";x.font=`600 30px ${SANS}`;x.fillText("NCT01685567",34,62);
  x.fillStyle="#56656F";x.font=`400 21px ${SANS}`;x.fillText("Eligibility criteria",34,96);
  x.fillStyle="#26323A";x.font=`400 21px Georgia, serif`;
  ["Inclusion:","Symptomatic: stenosis must be","≥ 50% as determined by angiogram...","Asymptomatic: stenosis must be","≥ 70% as determined by angiogram...","Discrete lesion located in the ICA...","Patient is ≥ 18 years of age."].forEach((l,i)=>x.fillText(l,34,150+i*40));
  x.fillStyle="#DCDAD2";for(let i=0;i<5;i++)x.fillRect(34,450+i*32,w-68-(i%2)*80,10);});
const trialDoc=new THREE.Mesh(new THREE.PlaneGeometry(0.46,0.6),new THREE.MeshBasicMaterial({map:trialDocCv.t,transparent:true,side:THREE.DoubleSide}));scene.add(trialDoc);
const parsedCv=makeCanvas(640,400);
parsedCv.draw((x,w,h)=>{x.fillStyle="#1D1A12";rr(x,0,0,w,h,24);x.fill();x.fillStyle="#E7B65A";x.font=`500 26px ${MONO}`;x.fillText("parsed_api.json",30,48);
  x.fillStyle="#EFEBE0";x.font=`400 22px ${MONO}`;
  ['{"id": "I2", "kind": "inclusion",',' "text": "Asymptomatic: stenosis','          ≥ 70% by angiogram..."},','{"id": "I4", "kind": "inclusion",',' "text": "≥ 18 years of age",',' "check": {"field": "age", ">=": 18}}'].forEach((l,i)=>x.fillText(l,30,96+i*46));});
const parsed=new THREE.Mesh(new THREE.PlaneGeometry(1.3,0.81),new THREE.MeshBasicMaterial({map:parsedCv.t,transparent:true,side:THREE.DoubleSide}));scene.add(parsed);
const PARSED_HOME=P(13,1.5,-3.4);

/* ---------- local LLM (shared by profiler, checker, critic) ---------- */
const LLM=P(17,2.3,-2.6);
const llmMat=M(0x5A7FD1,{flatShading:true,emissive:0x5A7FD1,emissiveIntensity:0.12});
const llm=new THREE.Mesh(new THREE.IcosahedronGeometry(0.75,1),llmMat);llm.position.copy(LLM);scene.add(llm);
const llmPed=new THREE.Mesh(new THREE.CylinderGeometry(0.55,0.65,1.5,24),M(0x26323A,{roughness:0.5}));llmPed.position.set(LLM.x,0.75,LLM.z);scene.add(llmPed);
addLabel("Ollama · qwen2.5:3b","Local model, CPU only",2.9,LLM.x,3.7,LLM.z);

/* ---------- profiler ---------- */
const PROF_X=6;
const profBox=new THREE.Mesh(new THREE.BoxGeometry(1.4,1.0,1.0),M(0x3E7CB1,{emissive:0x3E7CB1,emissiveIntensity:0.18,roughness:0.45}));profBox.position.set(PROF_X,0.5,0);scene.add(profBox);
addLabel("Patient profiler","Note to grounded facts",2.6,PROF_X,2.95,0);
const profCv=makeCanvas(640,540);

<tr><td>bm25</td><td class="n">0.712</td><td class="n">0.300</td><td class="n">n/a</td></tr></tbody></table>`}
];
const SUBSTEPS=["The note, the profile and the first 30 criteria go to the local model in one call","The model returns a judgment per criterion, with a quote when it gives one","“Discrete lesion in the ICA”: yes, and the quote is in the note, so met","“Asymptomatic: stenosis ≥ 70% by angiogram”: no quote, so unknown","“Patient is ≥ 18 years of age”: no quote, so unknown","The other 13 criteria are over the 30-per-trial cap and stay unknown"];

let stage=0,stageStart=0,playing=!matchMedia("(prefers-reduced-motion: reduce)").matches,activeSub=-1;
const camPos=P(0,0,0),camLook=P(0,0,0);let camInit=false;
const top=cards[0];

function reset(s){
  coord.position.set(s>=8?33.8:-0.5,0,s>=8?0.9:-0.95);coord.rotation.y=s>=8?Math.PI/2:0;walk(coord,0,false);
  note.visible=s<=2;note.material.opacity=1;note.scale.set(1,1,1);note.rotation.set(-Math.PI/2,0,0.1);place(note,NOTE_DESK);
  trialDoc.visible=false;parsed.visible=s>=1;parsed.scale.set(1,1,1);place(parsed,PARSED_HOME);parsed.rotation.set(0,0,0);
  prof.visible=s>=2;prof.scale.set(1,1,1);place(prof,PROF_HOME);drawProf(s>=3?6:0);
  cards.forEach((c,i)=>{c.visible=s>=3;c.scale.set(1,1,1);c.rotation.set(-0.35,0,0);place(c,gridPos(i));
    setTrial(c,s>=4&&TRIALS[i][3]!=="ok"?"fail":s>=8&&TRIALS[i][3]==="ok"?"possibly":"plain");});
  if(s>=4){setTrial(top,"top");place(top,SLOT[s>=8?4:s===7?4:s===6?2:s===5?1:0]);top.rotation.set(0,0,0);}
  if(s>=8)setTrial(top,"possibly");
  particle.visible=false;msg.visible=false;loopLines.forEach(l=>l.visible=s===5);profLine.visible=s===2;
  tally.visible=s>=6&&s<=7;if(tally.visible)drawTally();
  skipTag.visible=s===6;crMat.emissiveIntensity=0.2;crNode.material.opacity=1;
  branch.material.opacity=s===6?0.25:0.7;
  llmMat.emissiveIntensity=0.12;port.material.emissiveIntensity=0.5;
  drawBoard(s>=8?"judged":s>=7?"ranked":"empty");drawMon(s>=8?"result":"idle");
  chart.visible=s===9;
}

function update(s,t){
  if(s===0){const k=seg(t,0.6,2.2);note.rotation.x=lerp(-Math.PI/2,-0.25,k);note.position.y=lerp(0.91,1.25,k);note.position.z=lerp(0.12,0.35,k);}
  else if(s===1){
    trialDoc.visible=t<4.6;const a=seg(t,0.3,2.0),b=seg(t,2.6,4.4);
    if(t<2.4)moveArc(trialDoc,P(REG.x+0.4,1.9,REG.z+1.2),P(API.x-0.8,2.0,API.z+0.9),a,1.6);
    else{place(trialDoc,P(API.x-0.8,2.0,API.z+0.9));trialDoc.scale.setScalar(1-b);}
    apiG.rotation.y=t*0.4;apiMat.emissiveIntensity=t>2.0&&t<4.6?0.25+0.2*Math.sin(t*9):0.15;
    const c=seg(t,4.4,6.6);parsed.visible=t>4.4;moveArc(parsed,P(API.x-1.2,2.0,API.z+1.2),PARSED_HOME,c,1.8);
    port.material.emissiveIntensity=t>5.8&&t<7.4?0.5+0.5*Math.abs(Math.sin(t*8)):0.5;
  }
  else if(s===2){
    const k=seg(t,0.2,1.8);note.visible=t<2.4;moveArc(note,P(0.25,1.25,0.35),P(PROF_X-0.2,1.2,0.3),k,1.2);note.rotation.set(-0.25,0,0);
    if(t>1.8){const sc=1-seg(t,1.8,2.4);note.scale.setScalar(Math.max(sc,0.01));}
    const lt=t-2.2;if(lt>0&&lt<3.2){const u=(lt%1.6)/1.6,fw=lt<1.6;particle.visible=true;particle.position.copy(profLoop.getPointAt(fw?ease(u):1-ease(u)));
      msg.visible=true;msg.position.set(particle.position.x,particle.position.y+0.42,particle.position.z);drawMsg(fw?"Note + profile schema":"Facts, each with a quote");llmMat.emissiveIntensity=0.35;}
    else{particle.visible=false;msg.visible=false;llmMat.emissiveIntensity=0.12;}
    prof.visible=t>2.0;drawProf(Math.floor(seg(t,5.2,7.2)*6+0.001)+(t>7.2?0:0));
  }
  else if(s===3){
    cards.forEach((c,i)=>{const k=seg(t,0.2+i*0.18,0.9+i*0.18);moveArc(c,IN_TRAY,gridPos(i),k,0.6);c.visible=t>0.2+i*0.18;
      if(t>4.6&&TRIALS[i][3]!=="ok")setTrial(c,"fail");});
  }
  else if(s===4){
    const k=seg(t,0.3,1.8);moveArc(top,gridPos(0),SLOT[0],k,1.0);top.rotation.x=lerp(-0.35,0,k);
    if(t>2.2&&t<4.0){rcNode.material.emissiveIntensity=0.2+0.3*Math.abs(Math.sin(t*7));}else rcNode.material.emissiveIntensity=0.2;
    if(t>4.0)moveArc(top,SLOT[0],SLOT[1],seg(t,4.0,5.6),0.7);
  }
  else if(s===5){
    const L=10.8,lt=t%L,i=Math.floor(lt/1.6);
    if(i<5){const u=(lt-i*1.6)/1.6;const p=LOOP[i].c.getPointAt(ease(u));particle.visible=true;particle.position.copy(p);
      msg.visible=true;msg.position.set(p.x,p.y+0.42,p.z);drawMsg(LOOP[i].m);tally.visible=false;
      guard.material.emissiveIntensity=i>=2&&u<0.4?1.0:0.55;
      llmMat.emissiveIntensity=(i===0&&u>0.7)||(i===1&&u<0.3)?0.4:0.12;
      setSub(i);
    }else{particle.visible=false;msg.visible=false;if(!tally.visible){drawTally();tally.visible=true;}llmMat.emissiveIntensity=0.12;setSub(5);}
  }
  else if(s===6){
    moveArc(top,SLOT[1],SLOT[2],seg(t,0.2,1.4),0.5);
    crMat.emissiveIntensity=0.06;
    if(t>2.2)moveArc(top,SLOT[2],SLOT[4],seg(t,2.2,4.2),0.9);
  }
  else if(s===7){
    if(t<2.0){place(top,SLOT[4]);top.rotation.y=0;}
    scNode.material.emissiveIntensity=t<2.4?0.2+0.3*Math.abs(Math.sin(t*7)):0.2;
    if(t>2.0){moveArc(top,SLOT[4],P(RB_X-1.3,1.6,-0.6),seg(t,2.0,3.6),0.8);}
    if(t>3.0)drawBoard("ranked");
    if(t>5.0)drawBoard("judged");
  }
  else if(s===8){
    const k=seg(t,0.2,2.6);coord.position.x=lerp(33.0,34.9,k);coord.position.z=lerp(1.8,0.95,k);coord.rotation.y=lerp(Math.PI/2,Math.PI,k);walk(coord,t,k>0&&k<1);
    place(top,P(RB_X-1.3,1.6,-0.6));
  }
  llm.rotation.y+=0.004;llm.rotation.x+=0.002;
}

/* ---------- panel ---------- */
const $=id=>document.getElementById(id);
STAGES.forEach((S,i)=>{const b=document.createElement("button");b.setAttribute("aria-label",`Stage ${i+1}: ${S.t}`);b.onclick=()=>go(i);$("dots").appendChild(b);});
function setSub(i){if(i===activeSub)return;activeSub=i;document.querySelectorAll("ol.steps li").forEach((li,j)=>li.className=j===i?"on":"");}
function panel(){const S=STAGES[stage];$("count").textContent=`${stage+1} of ${STAGES.length}`;$("where").textContent=S.w;
  const tr=$("tier");tr.textContent=S.tier==="cloud"?"Cloud · public text":"Local";tr.className="tier "+S.tier;
  $("ttl").textContent=S.t;$("body").textContent=S.b;
  $("extra").innerHTML=S.loop?`<ol class="steps">${SUBSTEPS.map(s=>`<li>${s}</li>`).join("")}</ol>`:S.x;activeSub=-1;
  [...$("dots").children].forEach((b,i)=>b.setAttribute("aria-current",i===stage));
  $("prev").disabled=stage===0;$("next").disabled=stage===STAGES.length-1;}
function go(s){stage=Math.max(0,Math.min(STAGES.length-1,s));stageStart=performance.now();reset(stage);panel();}
function setPlaying(p){playing=p;$("play").textContent=p?"Pause":"Play";}
$("prev").onclick=()=>go(stage-1);$("next").onclick=()=>go(stage+1);
$("play").onclick=()=>{if(!playing&&stage===STAGES.length-1)go(0);setPlaying(!playing);};
addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(stage+1);if(e.key==="ArrowLeft")go(stage-1);if(e.key===" "){e.preventDefault();$("play").click();}});

/* ---------- theme + resize ---------- */
function theme(){const d=isDark();scene.background=new THREE.Color(d?0x0C1217:0xDDE3E6);floorMat.color.set(d?0x1A242A:0xC6CFD3);railMat.color.set(d?0x86B2E0:0x2D5B8C);lbEdgeMat.color.set(d?0x4CC291:0x2E9C72);}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",theme);
new MutationObserver(theme).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener("resize",resize);

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(0.05,(now-last)/1000);last=now;
  const t=(now-stageStart)/1000;update(stage,t);
  const [pos,look]=STAGES[stage].cam;const f=camera.aspect<0.9?1.7:camera.aspect<1.3?1.25:1;
  const tp=look.clone().add(pos.clone().sub(look).multiplyScalar(f));
  if(!camInit){camPos.copy(tp);camLook.copy(look);camInit=true;}
  const k=1-Math.exp(-dt*2.6);camPos.lerp(tp,k);camLook.lerp(look,k);
  camera.position.copy(camPos);camera.lookAt(camLook);
  chart.lookAt(camera.position);
  renderer.render(scene,camera);
  if(playing&&t>STAGES[stage].dur){if(stage<STAGES.length-1)go(stage+1);else setPlaying(false);}
}

function enableShadows(){scene.traverse(o=>{if(o.isMesh&&!o.material.isMeshBasicMaterial&&o!==floor){o.castShadow=true;o.receiveShadow=true;}});floor.receiveShadow=true;}
function start(){enableShadows();drawNote();drawChart();drawTally();theme();resize();setPlaying(playing);go(0);requestAnimationFrame(frame);}
const fontsReady=document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]):Promise.resolve();
fontsReady.then(()=>{redraws.forEach(f=>f());start();});
})();
</script>
</body>
